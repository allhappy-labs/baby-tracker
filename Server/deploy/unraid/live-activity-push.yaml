# Explicit opt-in overlay. The normal Unraid composition needs no push secrets.
services:
  db:
    secrets:
      - live_activity_password
  app:
    environment:
      BT_LIVE_ACTIVITY_PUSH_ENABLED: "true"
      BT_LIVE_ACTIVITY_DATABASE_URL_FILE: /run/secrets/live_activity_database_url
      BT_APNS_TEAM_ID: ${BT_APNS_TEAM_ID:?set BT_APNS_TEAM_ID}
      BT_APNS_KEY_ID: ${BT_APNS_KEY_ID:?set BT_APNS_KEY_ID}
      BT_APNS_BUNDLE_ID: ${BT_APNS_BUNDLE_ID:?set BT_APNS_BUNDLE_ID}
      BT_APNS_KEY_FILE: /run/secrets/apns_key
    secrets:
      - live_activity_database_url
      - apns_key

secrets:
  live_activity_password:
    file: ${BT_DEPLOY_ROOT:?set BT_DEPLOY_ROOT}/secrets/live_activity_password
  live_activity_database_url:
    file: ${BT_DEPLOY_ROOT:?set BT_DEPLOY_ROOT}/secrets/live_activity_database_url
  apns_key:
    file: ${BT_DEPLOY_ROOT:?set BT_DEPLOY_ROOT}/secrets/apns_key.p8
